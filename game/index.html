<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Mineko-san!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 全体コンテナ */
        .slide-container {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ーーー １．最初の案内画面（真っ暗な画面） ーーー */
        #touch-layer {
            position: absolute;
            inset: 0;
            background-color: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .touch-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.98); }
        }

        /* ーーー ２．お祝い本編画面（初期状態は非表示） ーーー */
        #celebration-layer {
            display: none; /* タッチされるまで非表示 */
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* 背景グラデーション */
        .slide-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
            z-index: 0;
        }

        /* 背景ライン */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(45deg, transparent 45%, rgba(255, 174, 0, 0.05) 50%, transparent 55%);
            background-size: 200% 200%;
            animation: flowingLines 15s linear infinite;
            z-index: 1;
        }

        @keyframes flowingLines {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* お祝い画像の調整 */
        .celebration-graphic {
            max-width: 90%;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 15px;
            filter: drop-shadow(0 0 30px rgba(255, 174, 0, 0.3));
            animation: graphicEntry 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes graphicEntry {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(15px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
        }

        /* 日付タイトル */
        .slide-title {
            color: #fff;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* メッセージテキスト */
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            max-width: 600px;
            line-height: 1.8;
        }

        /* ボタンのデザイン */
        .action-button {
            margin-top: 15px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #ffae00 0%, #ff7b00 100%);
            color: #000;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(255, 123, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .action-button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 50px rgba(255, 123, 0, 0.5);
            background: linear-gradient(135deg, #ffbe33 0%, #ff8c00 100%);
        }

        /* フィルムノイズ */
        .grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: 0.05;
            background-image: repeating-radial-gradient(circle at center, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.05) 1px, transparent 2px);
            animation: grainMove 0.3s infinite;
        }

        @keyframes grainMove {
            0% { transform: translate(0,0); }
            25% { transform: translate(-1px,1px); }
            50% { transform: translate(1px,-1px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <div class="bg-lines"></div>
        <div class="grain"></div>

        <div id="touch-layer" onclick="initCelebration()">
            <div class="touch-text">Please Touch</div>
        </div>

        <div id="celebration-layer" class="content-area">
            <img src="image_223a58.jpg" class="celebration-graphic" alt="Happy Birthday">

            <div class="text-group">
                <h1 class="slide-title">2026.06.01</h1>
                <p class="subtitle">みねこさんの特別な日のために、ひとつの物語を用意しました。<br>準備が整いましたら、下のボタンから冒険を始めてください。</p>
            </div>

            <a href="index2.html" class="action-button">
                ENTER THE GAME ➔
            </a>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="bgm.mp3" type="audio/mp3">
        <source src="bgm.ogg" type="audio/ogg">
    </audio>

    <script>
    function initCelebration() {
        const touchLayer = document.getElementById("touch-layer");
        const celebLayer = document.getElementById("celebration-layer");
        const audio = document.getElementById("bgm");

        // 1. まず確実にBGMの再生を開始（ユーザーが触れた直後なので100%鳴ります）
        audio.volume = 0;
        audio.play().then(() => {
            // じわっと音量を上げるフェードイン処理
            let fadeInterval = setInterval(() => {
                if (audio.volume < 0.3) {
                    audio.volume = Math.min(audio.volume + 0.05, 0.3);
                } else {
                    clearInterval(fadeInterval);
                }
            }, 200);
        }).catch(err => console.log("Audio error:", err));

        // 2. 「Please Touch」の黒い画面をフワッと消す
        touchLayer.style.opacity = "0";
        
        // 3. お祝いレイヤーを現してアニメーションを開始させる
        celebLayer.style.display = "flex";

        // 4. アニメーション（1秒）が終わったら黒いレイヤーを完全に削除
        setTimeout(() => {
            touchLayer.remove();
        }, 1000);
    }
    </script>

</body>
</html>
