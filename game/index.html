<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Mineko-san!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
        }

        /* 画面全体のコンテナ設定 */
        .slide-container {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 背景のグラデーション */
        .slide-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
            z-index: 0;
        }

        /* うっすら動く背景ライン */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(45deg, transparent 45%, rgba(255, 174, 0, 0.05) 50%, transparent 55%);
            background-size: 200% 200%;
            animation: flowingLines 15s linear infinite;
            z-index: 1;
        }

        @keyframes flowingLines {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .content-area {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* お祝い画像の調整 */
        .celebration-graphic {
            max-width: 90%;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 15px;
            filter: drop-shadow(0 0 30px rgba(255, 174, 0, 0.3));
            animation: graphicEntry 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes graphicEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                filter: blur(15px) drop-shadow(0 0 0px rgba(255, 174, 0, 0));
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px) drop-shadow(0 0 30px rgba(255, 174, 0, 0.3));
            }
        }

        /* 日付タイトルのデザイン */
        .slide-title {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1s forwards;
        }

        /* メッセージテキストのデザイン */
        .subtitle {
            font-family: sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            max-width: 600px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1.5s forwards;
        }

        /* ボタンのデザイン（ホバーで光る金〜オレンジ） */
        .action-button {
            margin-top: 15px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #ffae00 0%, #ff7b00 100%);
            color: #000;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(255, 123, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 2s forwards;
        }

        .action-button:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 50px rgba(255, 123, 0, 0.5);
            background: linear-gradient(135deg, #ffbe33 0%, #ff8c00 100%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* フィルムノイズ */
        .grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: 0.05;
            background-image: repeating-radial-gradient(circle at center, rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.05) 1px, transparent 2px);
            animation: grainMove 0.3s infinite;
        }

        @keyframes grainMove {
            0% { transform: translate(0,0); }
            25% { transform: translate(-1px,1px); }
            50% { transform: translate(1px,-1px); }
            75% { transform: translate(1px,1px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>

    <div class="slide-container">
        <div class="bg-lines"></div>
        <div class="grain"></div>

        <div class="content-area">
            <img src="image_223a58.jpg" class="celebration-graphic" alt="Happy Birthday">

            <div class="text-group">
                <h1 class="slide-title">2026.06.01</h1>
                <p class="subtitle">みねこさんの特別な日のために、ひとつの物語を用意しました。<br>準備が整いましたら、下のボタンから冒険を始めてください。</p>
            </div>

            <a href="index2.html" class="action-button">
                Enter the Game <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

</body>
</html>
